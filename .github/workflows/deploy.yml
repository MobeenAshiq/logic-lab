# Deploys to the live server when VERSION changes on main (or from the Actions tab).
# Bump VERSION (e.g. 1.0.0 -> 1.0.1), commit, push to main.
#
# Runs on a self-hosted GitHub runner installed ON the EC2 server
# (scripts/setup-github-runner.sh), so no SSH, firewall change or AWS keys are needed:
# the runner connects out to GitHub and deploys locally.
name: Deploy

on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

permissions:
  contents: write # push the v<VERSION> tag

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  APP_DIR: /home/ubuntu/logic-lab
  SITE: https://3-24-111-77.sslip.io

jobs:
  deploy:
    runs-on: [self-hosted, logiclab]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "value=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Back up the database
        run: sudo /usr/local/bin/logiclab-backup

      - name: Copy code into the app folder
        run: |
          rsync -a --delete \
            --exclude node_modules --exclude .next --exclude dist --exclude '.env*' \
            --exclude .git --exclude .github --exclude '*.tsbuildinfo' --exclude '*.pdf' --exclude /.claude \
            ./ "$APP_DIR/"

      - name: Backend - install, build, migrate, restart
        working-directory: ${{ env.APP_DIR }}/backend
        env:
          CI: "true"
          NODE_OPTIONS: --max-old-space-size=1536
        run: |
          pnpm install --frozen-lockfile --reporter=silent
          pnpm db:generate >/dev/null
          pnpm build >/dev/null
          pnpm db:deploy 2>&1 | tail -1
          pm2 restart api --update-env >/dev/null

      - name: Frontend - install, build, restart
        working-directory: ${{ env.APP_DIR }}/frontend
        env:
          CI: "true"
          NEXT_TELEMETRY_DISABLED: "1"
          NODE_OPTIONS: --max-old-space-size=1536
        run: |
          pnpm install --frozen-lockfile --reporter=silent
          pnpm build --no-lint 2>&1 | tail -3
          pm2 restart web --update-env >/dev/null
          pm2 save >/dev/null

      - name: Check the live site
        run: |
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$SITE/") || true
            [ "$code" = 200 ] && { echo "Site is up (HTTP 200)"; exit 0; }
            sleep 5
          done
          echo "Site returned HTTP $code" >&2; exit 1

      - name: Tag the release
        if: github.event_name == 'push'
        run: |
          tag="v${{ steps.version.outputs.value }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists"
          else
            git tag "$tag" && git push origin "$tag"
          fi
